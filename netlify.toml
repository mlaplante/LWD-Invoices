[build]
  # IMPORTANT: keep `prisma migrate deploy` in this command. netlify.toml
  # overrides package.json's build script entirely, so omitting it skips
  # migrations on deploy and the live DB drifts behind schema.prisma.
  # Symptom is "column X does not exist" 500s on any page that reads
  # the new column.
  # prune-turbopack-cache drops stale per-Next-version Turbopack cache dirs
  # (each ~600MB) so the cache @netlify/plugin-nextjs persists between builds
  # stays small enough to actually survive. It never fails the build.
  command = "node scripts/prune-turbopack-cache.mjs && prisma generate && prisma migrate deploy && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NOTE: .next/cache persistence needs no env flag — @netlify/plugin-nextjs
  # restores/saves it automatically every build (onPreBuild/onBuild). Check the
  # deploy log for "Next.js cache restored" vs "No Next.js cache to restore"
  # to see whether it worked. (A previous "NETLIFY_NEXT_CACHE_PERSIST" var here
  # was fictional — it appears nowhere in the plugin and did nothing.)

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Immutable cache for Next.js hashed static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts aggressively
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and static public assets
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache optimized images from Next.js Image CDN
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service workers must revalidate so clients receive cache/version updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Offline shell is static and contains no account data
[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Client portal and pay pages — token-gated, contains per-recipient data.
# Must NOT be cached by shared/CDN caches; force revalidation on every hit.
[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/pay/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
