name: CI

on:
  pull_request:
  push:
    branches: [main]
  # weekly-dependency-update.yml dispatches CI on its PR branch: pushes and PRs
  # made with GITHUB_TOKEN start no workflow runs, so it would otherwise get none.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # vitest coverage comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      # `npm ci` runs the postinstall hook, which already does `prisma generate`.
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      # ESLint is pinned to v9: eslint-config-next 16's nested eslint-plugin-react
      # crashes under ESLint 10 (context.getFilename removed). Revisit when
      # eslint-config-next supports ESLint 10.
      #
      # lint:ci is `eslint --max-warnings <n>`: errors always fail, and warnings
      # fail only if they exceed the ratchet number in package.json. Lower the
      # number as warnings get fixed; never raise it.
      - name: Lint
        run: npm run lint:ci
      - name: Test
        run: npm run test:coverage
      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      # Persist Next.js/Turbopack build cache between CI runs. Keyed on lockfile
      # + source hash; restore-keys lets a partial cache hit still warm the build.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
      # Placeholder env vars: static prerendering instantiates Supabase clients
      # at build time, but no real services are contacted. Migrations are NOT
      # run here — netlify.toml owns `prisma migrate deploy` on real deploys.
      - name: Build
        run: npx next build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Download a pinned release and verify its checksum rather than piping a
      # script from actionlint's main branch into bash on every run.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
