name: Weekly Dependency Update

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch CI on the update branch (last step)

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Update all packages to latest
        run: |
          npx npm-check-updates -u
          npm install

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: deps/weekly-update
          commit-message: "chore(deps): update all packages to latest"
          title: "chore(deps): weekly dependency update"
          body: |
            Automated weekly update of all packages to their latest versions via `npm-check-updates`.

            Please review the CI results and changelogs for any breaking changes before merging.
          labels: dependencies
          delete-branch: true

      # Pushes and PRs made with GITHUB_TOKEN start no workflow runs, so the PR
      # above would otherwise have no CI results to review. workflow_dispatch is
      # the exception; the run reports its checks on the branch's head commit.
      - name: Run CI on the update branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
